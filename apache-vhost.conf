<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    ProxyPass /sync/ws ws://127.0.0.1:1234/
    ProxyPassReverse /sync/ws ws://127.0.0.1:1234/

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
